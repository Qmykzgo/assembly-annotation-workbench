name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository contract
        run: |
          python3 -m py_compile scripts/*.py
          python scripts/validate_repo.py

      - name: Validate annotation manifest
        run: python scripts/validate_manifest.py assets/test-data/annotation.csv --check-paths

      - name: Validate report summarizer
        run: python scripts/summarize_annotation.py assets/test-data/annotation.fixture.tsv --output /tmp/annotation.tsv --markdown /tmp/annotation.md

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Nextflow
        run: |
          mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/nxf-home"
          curl -fsSL https://github.com/nextflow-io/nextflow/releases/download/v24.04.6/nextflow -o "$HOME/.local/bin/nextflow"
          chmod +x "$HOME/.local/bin/nextflow"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          NXF_HOME="$RUNNER_TEMP/nxf-home" nextflow -version

      - name: Run DSL2 stub workflow
        env:
          NXF_HOME: ${{ runner.temp }}/nxf-home
          NXF_ANSI_LOG: 'false'
        run: nextflow run main.nf -profile test -stub-run --outdir /tmp/annotation-results -ansi-log false
